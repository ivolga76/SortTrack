name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          package-manager-cache: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned action
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Audit JavaScript dependency graph
        run: npm audit --audit-level=low
      - name: Test before packaging
        run: |
          npm run typecheck
          npm test -- --run
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installed and portable distributions
        env:
          SOURCE_DATE_EPOCH: "0"
        run: npm run release:build
      - name: Verify complete release directory
        run: npm run release:verify
      - name: Upload verified release directory
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SortTrack-Windows-x64-${{ github.run_number }}
          path: src-tauri/target/release/bundle/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
