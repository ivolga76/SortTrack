[package]
name = "sorttrack"
version = "0.1.0"
description = "Local music library organizer"
authors = ["SortTrack contributors"]
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[lib]
name = "sorttrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
lofty = "0.24"
fs2 = "0.4.3"
rusqlite = { version = "0.40", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
